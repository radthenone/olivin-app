x-backend-build-test: &backend-build-test
  context: .
  dockerfile: docker/backend/Dockerfile
  target: test

x-backend-test-env: &backend-test-env
  - ./.envs/dev/backend/django.env
  - ./.envs/dev/backend/db.env
  - ./.envs/dev/backend/cache_broker.env
  - ./.envs/dev/backend/broker.env
  - ./.envs/dev/backend/s3.env
  - ./.envs/dev/backend/email.env
  - ./.envs/dev/backend/authorization.env

services:
  # Ten sam obraz co w dev, ale magazyn w tmpfs: każdy przebieg startuje
  # z pustym S3, a porty nie wychodzą na hosta (testy idą po sieci compose).
  olivin-s3:
    ports: !reset []
    volumes: !override
      - type: tmpfs
        target: /data
      - ./docker/s3/entrypoint.sh:/entrypoint-s3.sh:ro
    restart: "no"

  olivin-postgres-test:
    container_name: olivin-postgres-test
    image: postgres:16
    profiles: ["test"]
    tmpfs:
      - /var/lib/postgresql/data
    env_file:
      - ./.envs/dev/postgres.env
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    restart: "no"
    networks:
      - olivin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olivin_db"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  olivin-django-test:
    profiles: ["test"]
    build: *backend-build-test
    depends_on:
      olivin-postgres-test:
        condition: service_healthy
      olivin-redis:
        condition: service_healthy
      olivin-s3:
        condition: service_healthy
    env_file: *backend-test-env
    environment:
      POSTGRES_HOST: olivin-postgres-test
      POSTGRES_PORT: 5432
      DJANGO_ENVIRONMENT: test
      DJANGO_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      # Prawdziwy S3 dla testów integracyjnych (testing.py czyta endpoint
      # wyłącznie z tej zmiennej — `AWS_S3_ENDPOINT_URL` z maszyny
      # dewelopera nie może wyciekać do jednostek).
      TEST_S3_ENDPOINT_URL: http://olivin-s3:8333
    working_dir: /app/src
    volumes:
      - ./backend/src:/app/src
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    command: pytest -q --cov=. --cov-report=xml --cov-report=html --cov-fail-under=60
    restart: "no"
    networks:
      - olivin-network
