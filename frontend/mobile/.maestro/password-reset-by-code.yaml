# Reset hasła kodem z maila, bez deep linku (#313, ADR 0038).
# Wymaga backendu z MailHogiem (docker-compose: olivin-mailhog, :8025) i konta
# EMAIL. Uruchomienie:
#   maestro test .maestro/password-reset-by-code.yaml \
#     -e EMAIL=user@example.com -e NEW_PASSWORD='N0we-haslo-313!'
appId: com.olivin.frontend
env:
  MAILHOG_URL: http://10.0.2.2:8025
---
- launchApp
- tapOn: "Nie pamiętasz hasła?"
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Wyślij kod"
- assertVisible: "Nowe hasło"
- runScript:
    file: scripts/read-reset-code.js
    env:
      EMAIL: ${EMAIL}
      MAILHOG_URL: ${MAILHOG_URL}
- tapOn: "Kod z wiadomości"
- inputText: ${output.resetCode}
- tapOn: "Minimum 8 znaków"
- inputText: ${NEW_PASSWORD}
- tapOn: "Ustaw hasło"
- assertVisible: "Hasło zostało zmienione. Możesz się zalogować."
