          description: |-
            Rozmiar pierścionka; puste dla wyrobów bez rozmiaru

            * `8` - 8
            * `9` - 9
            * `10` - 10
            * `11` - 11
            * `12` - 12
            * `13` - 13
            * `14` - 14
            * `15` - 15
            * `16` - 16
            * `17` - 17
            * `18` - 18
            * `19` - 19
            * `20` - 20
            * `21` - 21
            * `22` - 22
            * `23` - 23
            * `24` - 24
            * `25` - 25
            * `26` - 26
        length:
          allOf:
          - $ref: '#/components/schemas/LengthEnum'
          readOnly: true
          description: |-
            Długość w centymetrach; puste dla wyrobów bez długości

            * `16` - 16 cm
            * `18` - 18 cm
            * `20` - 20 cm
            * `36` - 36 cm
            * `38` - 38 cm
            * `40` - 40 cm
            * `42` - 42 cm
            * `45` - 45 cm
            * `50` - 50 cm
            * `55` - 55 cm
            * `60` - 60 cm
            * `70` - 70 cm
            * `80` - 80 cm
        isMadeToOrder:
          type: boolean
          readOnly: true
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: Najwęższy gotowy rozmiar zdjęcia wariantu, a gdy wariant swojego
            nie ma — zdjęcia produktu. Pusty, gdy żadne zdjęcie nie jest jeszcze przetworzone.
          readOnly: true
      required:
      - id
      - isMadeToOrder
      - length
      - metalColor
      - productName
      - productSlug
      - size
      - sku
      - thumbnailUrl
    Category:
      type: object
      description: |-
        Węzeł drzewa wraz z potomkami.

        Narzut nie wychodzi na zewnątrz: to dana cenotwórcza panelu, nie treść
        katalogu.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Angielski identyfikator w adresie. Puste pole zostanie wypełnione
            z nazwy przy zapisie. Po zapisaniu nie da się go zmienić.
          pattern: ^[-a-zA-Z0-9_]+$
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          readOnly: true
      required:
      - children
      - id
      - name
      - slug
    ClarityEnum:
      enum:
      - FL
      - IF
      - VVS1
      - VVS2
      - VS1
      - VS2
      - SI1
      - SI2
      - I1
      - I2
      - I3
      type: string
      description: |-
        * `FL` - FL — bez skaz
        * `IF` - IF — bez skaz wewnętrznych
        * `VVS1` - VVS1
        * `VVS2` - VVS2
        * `VS1` - VS1
        * `VS2` - VS2
        * `SI1` - SI1
        * `SI2` - SI2
        * `I1` - I1
        * `I2` - I2
        * `I3` - I3
    Collection:
      type: object
      description: |-
        Kolekcja na liście — bez produktów, z ich liczbą.

        Lista kolekcji służy do nawigacji, nie do pokazania katalogu: zagnieżdżenie
        produktów w każdej z nich zamieniłoby jedno żądanie w cały katalog.
        Produkty pobiera się przez `GET /products/?collection=<slug>`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Angielski identyfikator w adresie. Puste pole zostanie wypełnione
            z nazwy przy zapisie. Po zapisaniu nie da się go zmienić.
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
          description: Opis kampanii albo sezonu po polsku
        productCount:
          type: integer
          readOnly: true
          description: Liczba opublikowanych produktów w kolekcji
