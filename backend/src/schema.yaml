      - lineTotal
      - productName
      - quantity
      - secondEngravingText
      - secondSize
      - size
      - sku
      - unitPrice
      - variant
    OrderStatusEnum:
      enum:
      - pending
      - paid
      - in_production
      - packed
      - shipped
      - delivered
      - cancelled
      - returned
      type: string
      description: |-
        * `pending` - Oczekuje na zapłatę
        * `paid` - Opłacone
