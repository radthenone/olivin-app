    SalesDocument:
      type: object
      description: |-
        Dokument sprzedaży do pobrania adresem podpisanym na czas (ADR 0025).

        Adres wygasa po `S3_SIGNED_URL_TTL` — klient pobiera listę na nowo,
        zamiast zapamiętywać odnośnik.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
