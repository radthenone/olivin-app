            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /promotions/:
    get:
      operationId: promotions_list
      description: Promocje w okresie obowiązywania, które działają bez kodu. Zakres
        to identyfikatory produktów, kolekcji i kategorii (kategoria obejmuje podkategorie)
        albo `wholeCatalog`. Promocje kodowe nie są tu wymieniane — kod zna ten, komu
        sklep go dał.
      summary: Aktywne promocje bez kodu
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Promotions
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPromotionList'
          description: ''
  /shipping-methods/:
    get:
      operationId: shipping_methods_list
      description: Zwraca metody właściwe dla strefy, których górna wartość zamówienia
        nie została przekroczona, wraz z kosztem policzonym dla podanej wartości koszyka.
        Powyżej progu darmowej dostawy koszt wynosi zero. Odbiór osobisty nie ma górnej
        wartości zamówienia, więc jest na liście zawsze.
      summary: Metody dostawy dostępne dla koszyka
      parameters:
      - in: query
        name: orderValue
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Wartość koszyka w groszach; domyślnie pusty koszyk
      - in: query
        name: zone
        schema:
          enum:
          - PL
          - EU
          type: string
          default: PL
          minLength: 1
        description: |-
          Strefa dostawy wynikająca z adresu klienta

          * `PL` - Polska
          * `EU` - Unia Europejska
      tags:
      - Shipping
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingOffer'
          description: ''
