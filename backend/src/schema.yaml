    CouponCode:
      type: object
      description: Kod kuponu wpisany w koszyku; wielkość liter nie ma znaczenia.
      properties:
        code:
          type: string
          description: Kod kuponu nadany przez sklep
          maxLength: 32
      required:
      - code
    CutEnum:
      enum:
      - brilliant
      - princess
      - emerald
      - oval
      - pear
      - marquise
      - cushion
      - asscher
      - radiant
      - heart
      - cabochon
      type: string
      description: |-
        * `brilliant` - Brylantowy
        * `princess` - Princessa
        * `emerald` - Szmaragdowy
        * `oval` - Owalny
        * `pear` - Gruszka
        * `marquise` - Markiza
        * `cushion` - Poduszka
        * `asscher` - Asscher
        * `radiant` - Radiant
        * `heart` - Serce
        * `cabochon` - Kaboszon
    FinenessEnum:
      enum:
      - '333'
      - '375'
      - '585'
      - '750'
      - '916'
      - '925'
      - '950'
      - '999'
      type: string
      description: |-
        * `333` - 333 (8 karatów)
        * `375` - 375 (9 karatów)
        * `585` - 585 (14 karatów)
        * `750` - 750 (18 karatów)
        * `916` - 916 (22 karaty)
        * `925` - 925 (srebro próby 925)
        * `950` - 950 (platyna)
        * `999` - 999 (kruszec inwestycyjny)
    Gemstone:
      type: object
      description: |-
        Kamień z parametrami i adresem certyfikatu, jeśli jest.

        Adres jest podpisany na czas, bo certyfikat leży w prywatnym buckecie
        `documents` (ADR 0025). Stały odnośnik do dokumentu laboratorium byłby
        dostępny dla każdego, kto go raz zobaczył.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/StoneEnum'
          readOnly: true
          description: |-
            Rodzaj kamienia

            * `diamond` - Diament
            * `sapphire` - Szafir
            * `ruby` - Rubin
            * `emerald` - Szmaragd
            * `pearl` - Perła
            * `amber` - Bursztyn
            * `topaz` - Topaz
            * `amethyst` - Ametyst
            * `cubic_zirconia` - Cyrkonia
            * `moissanite` - Moissanit
        carat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          readOnly: true
          description: Masa w karatach
        clarity:
          allOf:
          - $ref: '#/components/schemas/ClarityEnum'
          readOnly: true
          description: |-
            Czystość; pusta, gdy nie była oznaczana

            * `FL` - FL — bez skaz
            * `IF` - IF — bez skaz wewnętrznych
            * `VVS1` - VVS1
            * `VVS2` - VVS2
            * `VS1` - VS1
            * `VS2` - VS2
            * `SI1` - SI1
            * `SI2` - SI2
            * `I1` - I1
            * `I2` - I2
            * `I3` - I3
        colour:
          allOf:
          - $ref: '#/components/schemas/ColourEnum'
          readOnly: true
          description: |-
            Barwa; pusta, gdy nie była oznaczana

            * `D` - D — bezbarwny
            * `E` - E
            * `F` - F
            * `G` - G
            * `H` - H
            * `I` - I
            * `J` - J
            * `K` - K
            * `L` - L
            * `M` - M
            * `fancy` - Barwa fantazyjna
        cut:
          allOf:
          - $ref: '#/components/schemas/CutEnum'
          readOnly: true
          description: |-
            Szlif; pusty, gdy nie był oznaczany

            * `brilliant` - Brylantowy
            * `princess` - Princessa
            * `emerald` - Szmaragdowy
            * `oval` - Owalny
            * `pear` - Gruszka
            * `marquise` - Markiza
            * `cushion` - Poduszka
            * `asscher` - Asscher
            * `radiant` - Radiant
            * `heart` - Serce
            * `cabochon` - Kaboszon
        laboratory:
          type: string
          readOnly: true
          description: Laboratorium, które wystawiło certyfikat
        certificateNumber:
          type: string
          readOnly: true
          description: Numer certyfikatu nadany przez laboratorium
        certificateUrl:
          type: string
          format: uri
          nullable: true
          description: Adres certyfikatu podpisany na czas; pusty, gdy kamień nie
            ma certyfikatu.
          readOnly: true
      required:
      - carat
      - certificateNumber
      - certificateUrl
      - clarity
      - colour
      - cut
      - id
      - kind
      - laboratory
