      - D
      - E
      - F
      - G
      - H
      - I
      - J
      - K
      - L
      - M
      - fancy
      type: string
      description: |-
        * `D` - D — bezbarwny
        * `E` - E
        * `F` - F
        * `G` - G
        * `H` - H
        * `I` - I
        * `J` - J
        * `K` - K
        * `L` - L
        * `M` - M
        * `fancy` - Barwa fantazyjna
    Consent:
      type: object
      description: |-
        Zapis zgody: dokument z listy bieżących wersji plus podmiot.

        Podmiot bierze się z żądania — zalogowany klient z uwierzytelnienia,
        gość z pola `email`. Klient nie wskazuje użytkownika jawnie, więc nie
        da się zapisać zgody w cudzym imieniu.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        document:
          type: string
          format: uuid
          description: Wersja dokumentu, której dotyczy zgoda
        email:
          type: string
          format: email
          writeOnly: true
          description: E-mail gościa; pomijany przy zalogowanym kliencie
        kind:
          type: string
          readOnly: true
        version:
          type: string
          readOnly: true
          description: Kopia wersji dokumentu z chwili udzielenia zgody
        grantedAt:
          type: string
          format: date-time
          readOnly: true
          description: Chwila udzielenia zgody
