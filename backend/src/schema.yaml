    Money:
      type: object
      description: |-
        Kwota jako para: liczba całkowita groszy i kod waluty (ADR 0009).

        Kwota w API nie jest gołą liczbą ani łańcuchem z przecinkiem: klient
        dostaje tę samą parę, którą backend trzyma w `common.money.Money`, więc
        nigdzie po drodze nie powstaje liczba zmiennoprzecinkowa.
      properties:
        amount:
          type: integer
          readOnly: true
          description: Kwota w najmniejszej jednostce waluty (grosze)
        currency:
          type: string
          readOnly: true
          description: Kod waluty ISO 4217
      required:
      - amount
      - currency
    Notification:
      type: object
      description: Powiadomienie klienta — tylko do odczytu; oznaczenie odczytania
        ma osobny endpoint.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/NotificationKindEnum'
          readOnly: true
          description: |-
            Rodzaj zdarzenia

            * `order_status_changed` - Zmiana statusu zamówienia
            * `order_paid` - Zamówienie opłacone
            * `document_ready` - Dokument gotowy
        message:
          type: string
          readOnly: true
          description: Treść powiadomienia do wyświetlenia
        data:
          readOnly: true
          description: Dane zdarzenia, np. numer zamówienia
        isRead:
          type: boolean
          readOnly: true
        readAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the record was created
      required:
      - createdAt
      - data
      - id
      - isRead
      - kind
      - message
      - readAt
    NotificationKindEnum:
      enum:
      - order_status_changed
      - order_paid
      - document_ready
      type: string
      description: |-
        * `order_status_changed` - Zmiana statusu zamówienia
        * `order_paid` - Zamówienie opłacone
        * `document_ready` - Dokument gotowy
    NotificationPreference:
      type: object
      description: Zgoda marketingowa klienta, osobno per kanał.
      properties:
        marketingEmail:
          type: boolean
          description: Zgoda na marketing e-mailem
        marketingPush:
          type: boolean
          description: Zgoda na marketing push
    Order:
      type: object
      description: |-
        Zamówienie w postaci, w jakiej ogląda je klient.

        Kwoty wychodzą policzone: klient nie składa sumy z pozycji, bo to
        backend rozstrzyga, ile jest do zapłaty (ADR 0012).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
          description: Numer, którym klient posługuje się w kontakcie ze sklepem
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
          description: |-
            Etap cyklu życia zamówienia

            * `pending` - Oczekuje na zapłatę
            * `paid` - Opłacone
            * `in_production` - W produkcji
            * `packed` - Spakowane
            * `shipped` - Wysłane
            * `delivered` - Dostarczone
            * `cancelled` - Anulowane
            * `returned` - Zwrócone
        email:
          type: string
          format: email
          readOnly: true
          description: Adres, pod który idzie potwierdzenie. Zawsze wypełniony — także
            dla klienta z kontem, bo zamówienie ma zostać czytelne po anonimizacji
            konta.
        recipientName:
          type: string
          readOnly: true
          description: Imię i nazwisko odbiorcy z chwili złożenia zamówienia
        street:
          type: string
          readOnly: true
        street2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        postalCode:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
          description: Kod kraju ISO 3166-1 alfa-2 z chwili złożenia zamówienia
        shippingMethodName:
          type: string
          readOnly: true
          description: Nazwa metody z chwili złożenia — cennik wolno potem zmienić
        currency:
