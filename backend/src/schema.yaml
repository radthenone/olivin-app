openapi: 3.0.3
info:
  title: olivin-app
  version: 1.0.0
  description: API documentation
paths:
  /cart/:
    get:
      operationId: cart_retrieve
      description: Pozycje z ceną aktualną (koszyk nie zamraża cen), cena grawerunku
        osobno, liczba pozycji i suma. Klient bez koszyka dostaje pusty koszyk, a
        nie 404 — odczyt nie zakłada wiersza.
      summary: Koszyk klienta albo gościa
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token koszyka gościa wydany przy pierwszym dodaniu pozycji. Zalogowany
          klient go nie wysyła — koszyk wynika z uwierzytelnienia.
      tags:
      - Cart
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /cart/coupon/:
    post:
      operationId: cart_coupon_create
      description: Wpisuje kupon; nowy kod zastępuje poprzedni. Nieznany, wykorzystany
        albo przeterminowany kupon to 400. Kupon pokrywa towar po promocjach (`couponAmount`),
        nigdy dostawę; nadwyżka nominału przepada. Limit żądań zakresu `auth` (10/min).
        Bez tokenu gość dostaje nowy koszyk i jego token.
      summary: Kupon w koszyku
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token koszyka gościa wydany przy pierwszym dodaniu pozycji. Zalogowany
          klient go nie wysyła — koszyk wynika z uwierzytelnienia.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CouponCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CouponCode'
        required: true
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_coupon_destroy
      description: Kupon wraca do niewykorzystanych. Klient bez koszyka dostaje pusty
        koszyk.
      summary: Usunięcie kuponu z koszyka
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token koszyka gościa wydany przy pierwszym dodaniu pozycji. Zalogowany
          klient go nie wysyła — koszyk wynika z uwierzytelnienia.
      tags:
      - Cart
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /cart/items/:
    post:
      operationId: cart_items_create
      description: Żądanie bez tokenu zakłada koszyk gościa i zwraca jego token w
        polu `cartToken`. Pozycja o tej samej personalizacji dolicza sztuki; inny
        grawerunek zakłada osobną pozycję.
      summary: Dodanie pozycji do koszyka
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token koszyka gościa wydany przy pierwszym dodaniu pozycji. Zalogowany
          klient go nie wysyła — koszyk wynika z uwierzytelnienia.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemWrite'
        required: true
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /cart/items/{id}/:
    patch:
      operationId: cart_items_partial_update
      description: Zero usuwa pozycję z koszyka.
      summary: Zmiana liczby sztuk pozycji
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token koszyka gościa wydany przy pierwszym dodaniu pozycji. Zalogowany
          klient go nie wysyła — koszyk wynika z uwierzytelnienia.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Pozycja koszyka.
        required: true
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantity'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantity'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantity'
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_items_destroy
      description: |-
        Pozycje koszyka.

        Actions:
        - create:  POST /cart/items/        — dodaje pozycję; gość dostaje token
        - partial_update: PATCH /cart/items/{id}/ — zmienia liczbę sztuk
        - destroy: DELETE /cart/items/{id}/ — usuwa pozycję

        Każda odpowiedź to cały koszyk, nie sama pozycja: po zmianie ilości
        klient i tak potrzebuje nowej sumy, a osobne wywołanie po nią umiałoby
        się rozjechać z tym, co właśnie zapisał.
      summary: Usunięcie pozycji z koszyka
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token koszyka gościa wydany przy pierwszym dodaniu pozycji. Zalogowany
          klient go nie wysyła — koszyk wynika z uwierzytelnienia.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Pozycja koszyka.
        required: true
      tags:
      - Cart
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /cart/merge/:
    post:
      operationId: cart_merge_create
      description: 'Pozycje gościa trafiają do koszyka konta: te o tej samej personalizacji
        sumują ilości w granicach limitu sztuk, pozostałe stają obok. Koszyk gościa
        i jego token przestają istnieć.'
      summary: Scalenie koszyka gościa z koszykiem konta
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token koszyka gościa wydany przy pierwszym dodaniu pozycji. Zalogowany
          klient go nie wysyła — koszyk wynika z uwierzytelnienia.
      tags:
      - Cart
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /cart/promotion-code/:
    post:
      operationId: cart_promotion_code_create
      description: Aktywuje promocję kodową; nowy kod zastępuje poprzedni. Nieznany
        albo nieaktywny kod to 400. Czy promocja obniży którąś pozycję, widać w `discountAmount`
        — zależy od zakresu, limitów i progu koszyka. Bez tokenu gość dostaje nowy
        koszyk i jego token.
      summary: Kod promocyjny w koszyku
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token koszyka gościa wydany przy pierwszym dodaniu pozycji. Zalogowany
          klient go nie wysyła — koszyk wynika z uwierzytelnienia.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PromotionCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PromotionCode'
        required: true
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /categories/:
    get:
      operationId: categories_list
      description: Zwraca korzenie taksonomii wraz z całym zagnieżdżeniem. Odpowiedź
        nie jest stronicowana — gałąź bez korzenia nie jest drzewem.
      summary: Drzewo kategorii
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - pl
        description: Język pól tekstowych. Bez tego parametru brany jest nagłówek
          `Accept-Language`, a w jego braku polski. Brakujące tłumaczenie schodzi
          do tekstu polskiego; slug nie jest tłumaczony.
      tags:
      - Categories
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /categories/{slug}/:
    get:
      operationId: categories_retrieve
      description: Zwraca wskazaną kategorię wraz z jej zagnieżdżonymi potomkami.
        Adresem jest slug, nie identyfikator.
      summary: Gałąź drzewa od wskazanej kategorii
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - pl
        description: Język pól tekstowych. Bez tego parametru brany jest nagłówek
          `Accept-Language`, a w jego braku polski. Brakujące tłumaczenie schodzi
          do tekstu polskiego; slug nie jest tłumaczony.
      - in: path
        name: slug
        schema:
          type: string
          description: Angielski identyfikator w adresie. Puste pole zostanie wypełnione
            z nazwy przy zapisie. Po zapisaniu nie da się go zmienić.
        required: true
      tags:
      - Categories
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /collections/:
    get:
      operationId: collections_list
      description: Zwraca kolekcje, w których jest co najmniej jeden opublikowany
        produkt. Produkty kolekcji pobiera się przez `GET /products/?collection=<slug>`.
      summary: Lista kolekcji
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - pl
        description: Język pól tekstowych. Bez tego parametru brany jest nagłówek
          `Accept-Language`, a w jego braku polski. Brakujące tłumaczenie schodzi
          do tekstu polskiego; slug nie jest tłumaczony.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Collections
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollectionList'
          description: ''
  /collections/{slug}/:
    get:
      operationId: collections_retrieve
      description: Adresem jest slug. Pusta kolekcja to 404.
      summary: Pojedyncza kolekcja
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - pl
        description: Język pól tekstowych. Bez tego parametru brany jest nagłówek
          `Accept-Language`, a w jego braku polski. Brakujące tłumaczenie schodzi
          do tekstu polskiego; slug nie jest tłumaczony.
      - in: path
        name: slug
        schema:
          type: string
          description: Angielski identyfikator w adresie. Puste pole zostanie wypełnione
            z nazwy przy zapisie. Po zapisaniu nie da się go zmienić.
        required: true
      tags:
      - Collections
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
          description: ''
  /consents/:
    post:
      operationId: consents_create
      description: Zalogowany klient udziela zgody na konto, gość — na podany e-mail.
        Dokument musi być bieżącą wersją z `GET /consents/documents/`.
      summary: Zapis zgody
      tags:
      - Consents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consent'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Consent'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Consent'
        required: true
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
          description: ''
  /consents/documents/:
    get:
      operationId: consents_documents_list
      description: Po jednej obowiązującej wersji regulaminu, polityki prywatności
        i zgody marketingowej. Rodzaj bez dokumentu jest pominięty.
      summary: Bieżące wersje dokumentów
      tags:
      - Consents
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentDocument'
          description: ''
  /csrf/:
    get:
      operationId: csrf_list
      tags:
      - Csrf
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    csrfToken:
                      type: string
          description: ''
  /customers/addresses/:
    get:
      operationId: customers_addresses_list
      description: |-
        A viewset for viewing and editing address instances.

        Actions:
        - list:           GET  /api/v1/addresses/
        - retrieve:       GET  /api/v1/addresses/{id}/
        - create:         POST /api/v1/addresses/
        - update:         PUT  /api/v1/addresses/{id}/
        - partial_update: PATCH /api/v1/addresses/{id}/
        - destroy:        DELETE /api/v1/addresses/{id}/
        - set_default:    PATCH /api/v1/addresses/{id}/set-default/
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Addresses
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: customers_addresses_create
      description: |-
        A viewset for viewing and editing address instances.

        Actions:
        - list:           GET  /api/v1/addresses/
        - retrieve:       GET  /api/v1/addresses/{id}/
        - create:         POST /api/v1/addresses/
        - update:         PUT  /api/v1/addresses/{id}/
        - partial_update: PATCH /api/v1/addresses/{id}/
        - destroy:        DELETE /api/v1/addresses/{id}/
        - set_default:    PATCH /api/v1/addresses/{id}/set-default/
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /customers/addresses/{id}/:
    get:
      operationId: customers_addresses_retrieve
      description: |-
        A viewset for viewing and editing address instances.

        Actions:
        - list:           GET  /api/v1/addresses/
        - retrieve:       GET  /api/v1/addresses/{id}/
        - create:         POST /api/v1/addresses/
        - update:         PUT  /api/v1/addresses/{id}/
        - partial_update: PATCH /api/v1/addresses/{id}/
        - destroy:        DELETE /api/v1/addresses/{id}/
        - set_default:    PATCH /api/v1/addresses/{id}/set-default/
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Addresses
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: customers_addresses_update
      description: |-
        A viewset for viewing and editing address instances.

        Actions:
        - list:           GET  /api/v1/addresses/
        - retrieve:       GET  /api/v1/addresses/{id}/
        - create:         POST /api/v1/addresses/
        - update:         PUT  /api/v1/addresses/{id}/
        - partial_update: PATCH /api/v1/addresses/{id}/
        - destroy:        DELETE /api/v1/addresses/{id}/
        - set_default:    PATCH /api/v1/addresses/{id}/set-default/
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: customers_addresses_partial_update
      description: |-
        A viewset for viewing and editing address instances.

        Actions:
        - list:           GET  /api/v1/addresses/
        - retrieve:       GET  /api/v1/addresses/{id}/
        - create:         POST /api/v1/addresses/
        - update:         PUT  /api/v1/addresses/{id}/
        - partial_update: PATCH /api/v1/addresses/{id}/
        - destroy:        DELETE /api/v1/addresses/{id}/
        - set_default:    PATCH /api/v1/addresses/{id}/set-default/
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: customers_addresses_destroy
      description: |-
        A viewset for viewing and editing address instances.

        Actions:
        - list:           GET  /api/v1/addresses/
        - retrieve:       GET  /api/v1/addresses/{id}/
        - create:         POST /api/v1/addresses/
        - update:         PUT  /api/v1/addresses/{id}/
        - partial_update: PATCH /api/v1/addresses/{id}/
        - destroy:        DELETE /api/v1/addresses/{id}/
        - set_default:    PATCH /api/v1/addresses/{id}/set-default/
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Addresses
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /customers/addresses/{id}/set-default/:
    patch:
      operationId: customers_addresses_set_default_partial_update
      description: Sets the address as the default address for the authenticated user.
      summary: Set Default Address
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                AddressSetAsDefault:
                  value:
                    id: 1
                    street: ul. Przykładowa 1
                    city: Warszawa
                    postal_code: 00-001
                    country: PL
                    is_default: true
                  summary: Address set as default
          description: Address set as default successfully
        '400':
          description: Address is already set as default
        '403':
          description: Permission denied
        '404':
          description: Address not found
  /customers/profile/:
    get:
      operationId: customers_profile_list
      description: |-
        A viewset for viewing and editing profile instances.

        Actions:
        - list:           GET  /api/v1/profiles/
        - retrieve:       GET  /api/v1/profiles/{id}/
        - create:         POST /api/v1/profiles/
        - update:         PUT  /api/v1/profiles/{id}/
        - partial_update: PATCH /api/v1/profiles/{id}/
        - destroy:        DELETE /api/v1/profiles/{id}/
        - change_role:    PATCH /api/v1/profiles/{id}/change-role/
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Profiles
      security:
      - XSessionTokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfileList'
          description: ''
    post:
      operationId: customers_profile_create
      description: |-
