    Promotion:
      type: object
      description: |-
        Promocja widoczna w sklepie — bez kodu i bez limitów.

        Limity są sprawą sklepu: klient dowie się o wyczerpaniu z wyceny
        koszyka, a pokazywanie liczników zachęcałoby do wyścigu o ostatnie użycia.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Nazwa promocji po polsku
        kind:
          allOf:
          - $ref: '#/components/schemas/PromotionKindEnum'
          readOnly: true
          description: |-
            Procentowa albo kwotowa

            * `percent` - Procentowa
            * `amount` - Kwotowa
        value:
          type: integer
          readOnly: true
          description: Procent obniżki (1–100) albo kwota obniżki jednego egzemplarza
            w groszach — zależnie od rodzaju
        currency:
          type: string
          readOnly: true
          description: Waluta kwoty obniżki i minimalnej wartości koszyka
        wholeCatalog:
          type: boolean
          readOnly: true
          description: Promocja na cały katalog — wtedy listy poniżej są pomijane
        products:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
          description: Produkty objęte promocją
        collections:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
          description: Kolekcje objęte promocją
        categories:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
          description: Kategorie objęte promocją — razem z ich podkategoriami
        startsAt:
          type: string
          format: date-time
          readOnly: true
          description: Początek obowiązywania
        endsAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Koniec obowiązywania; puste oznacza promocję bezterminową
        minCartValue:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
          nullable: true
          description: Minimalna wartość koszyka przed rabatami; pusta — bez progu
        requiresPremium:
          type: boolean
          readOnly: true
          description: Tylko dla klientów premium (`CONTEXT.md`, Membership).
      required:
