    OrderItem:
      type: object
      description: |-
        Pozycja zamówienia — wyłącznie kopie z chwili złożenia (ADR 0010).

        Nie ma tu odwołania do dzisiejszej ceny wariantu ani do jego stanu:
        zamówienie ma pokazywać to, co klient kupił, a nie to, co jest w sklepie
        teraz.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant:
          type: string
          format: uuid
          readOnly: true
          description: Kupiony wariant — do odnalezienia karty produktu, nie do wyceny
        productName:
          type: string
          readOnly: true
        sku:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
          description: Liczba sztuk pozycji, najwyżej 5
        size:
          type: string
          readOnly: true
          description: Rozmiar pierwszego egzemplarza, skopiowany z wariantu
        secondSize:
          allOf:
          - $ref: '#/components/schemas/SizeEnum'
          readOnly: true
          description: |-
            Rozmiar drugiego egzemplarza pary (ADR 0024)

            * `8` - 8
            * `9` - 9
            * `10` - 10
            * `11` - 11
            * `12` - 12
            * `13` - 13
            * `14` - 14
            * `15` - 15
            * `16` - 16
            * `17` - 17
            * `18` - 18
            * `19` - 19
            * `20` - 20
            * `21` - 21
            * `22` - 22
            * `23` - 23
            * `24` - 24
            * `25` - 25
            * `26` - 26
        engravingText:
          type: string
          readOnly: true
        secondEngravingText:
          type: string
          readOnly: true
        isPair:
          type: boolean
          readOnly: true
        isMadeToOrder:
          type: boolean
          readOnly: true
          description: Czy wyrób powstaje dopiero po złożeniu zamówienia (ADR 0024)
        unitPrice:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        goodsPrice:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        engravingTotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        lineTotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        discountAmount:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        discountedTotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
