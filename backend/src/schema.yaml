      - subtotal
      - total
    CartItem:
      type: object
      description: |-
        Pozycja koszyka z wyceną liczoną przy odczycie, nie zamrożoną.

        Cena idzie prosto z wariantu, bo koszyk ma pokazywać dzisiejszy cennik
        (`CONTEXT.md`, CartItem). Kopia powstaje dopiero w pozycji zamówienia
        (ADR 0010).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant:
          allOf:
          - $ref: '#/components/schemas/CartVariant'
          readOnly: true
        quantity:
          type: integer
          readOnly: true
          description: Liczba sztuk pozycji, najwyżej 5
        engravingText:
          type: string
          readOnly: true
          description: Treść grawerunku; przy parze trafia na oba egzemplarze, o ile
            drugi nie ma własnej. Puste oznacza wyrób bez grawerunku.
        secondSize:
          allOf:
          - $ref: '#/components/schemas/SizeEnum'
          readOnly: true
          description: |-
            Rozmiar drugiego egzemplarza pary. Wypełniony zamienia pozycję w parę; pierwszy rozmiar bierze się z wariantu.

            * `8` - 8
            * `9` - 9
            * `10` - 10
            * `11` - 11
            * `12` - 12
            * `13` - 13
            * `14` - 14
            * `15` - 15
            * `16` - 16
            * `17` - 17
            * `18` - 18
            * `19` - 19
            * `20` - 20
            * `21` - 21
            * `22` - 22
            * `23` - 23
            * `24` - 24
            * `25` - 25
            * `26` - 26
        secondEngravingText:
          type: string
          readOnly: true
          description: Grawerunek drugiego egzemplarza, gdy ma być inny niż pierwszego
        isPair:
          type: boolean
          readOnly: true
        unitPrice:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        goodsPrice:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        engravingPrice:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        lineTotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
      required:
      - engravingPrice
      - engravingText
      - goodsPrice
      - id
      - isPair
      - lineTotal
      - quantity
      - secondEngravingText
      - secondSize
      - unitPrice
      - variant
    CartItemWrite:
      type: object
      description: |-
        Dodanie pozycji do koszyka.

        Wariant wskazuje się identyfikatorem i musi pochodzić z opublikowanego
        produktu: szkic nie istnieje dla sklepu pod żadnym adresem, więc nie może
        wejść do koszyka bocznymi drzwiami.
      properties:
        variant:
          type: string
          format: uuid
          description: Identyfikator kupowanego wariantu
        quantity:
          type: integer
          maximum: 5
          minimum: 1
          default: 1
          description: Liczba sztuk pozycji, najwyżej 5
        engravingText:
          type: string
          default: ''
          description: Treść grawerunku; wymaga produktu grawerowalnego
          maxLength: 50
        secondSize:
          default: ''
          description: |-
            Rozmiar drugiego egzemplarza pary (wyrób na zamówienie)

            * `8` - 8
            * `9` - 9
            * `10` - 10
            * `11` - 11
            * `12` - 12
            * `13` - 13
            * `14` - 14
            * `15` - 15
            * `16` - 16
            * `17` - 17
            * `18` - 18
            * `19` - 19
            * `20` - 20
            * `21` - 21
            * `22` - 22
            * `23` - 23
            * `24` - 24
            * `25` - 25
            * `26` - 26
          oneOf:
          - $ref: '#/components/schemas/SizeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        secondEngravingText:
          type: string
          default: ''
          description: Grawerunek drugiego egzemplarza, gdy ma być inny
          maxLength: 50
      required:
      - variant
    CartVariant:
      type: object
      description: |-
        Tyle o wariancie, ile potrzebuje wiersz koszyka — nie cała karta produktu.

        Miniatura jest tu, a nie po stronie klienta: bez niej rozwijana lista
        koszyka musiałaby dociągać `GET /products/` po jednym żądaniu na wiersz,
        żeby pokazać, co klient właściwie kupuje.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          readOnly: true
          description: Oznaczenie magazynowe wariantu, unikalne w całym katalogu
        productName:
          type: string
          readOnly: true
        productSlug:
          type: string
          readOnly: true
        metalColor:
          allOf:
