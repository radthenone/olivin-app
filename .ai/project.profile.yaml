# Profil projektu — jedyne miejsce konfiguracji kita (Tiery zamiast presetów).
# Jeden Tier = jeden Stack albo `none`. Puste Tiery = sam core.
# Wariant starszego podejścia: `react@legacy`, `angular@rxjs`.
# Po zmianie: `kit-ai reload` odświeża pliki kita (agenci, mcp.json, hooki).

name: olivin-app-kit-test
language: pl
clients: claude,codex,vscode,opencode,antigravity

backend: django
web: react
mobile: expo

codegen: orval

server:
  guard: auto

include:
  - arch:docker-structure
  - arch:taskfile
  - arch:ci-cd
  - arch:monorepo-layout
  - arch:fe-be-separation

patterns:
  - capability-provider
  - webhooks

overlays:
  - .ai/project.md

agents:
  light: cleanup,git-check,git-commit,git-end,git-start,headless
  standard: create-skill,create-task,kit-project-begin,kit-project-edit,review-architecture,review-backend,review-bugbot,review-frontend,review-tests,review-ui,subagent-backend,subagent-frontend,teacher-agent,teacher-architecture,teacher-backend,teacher-frontend
  heavy: night-run,review-edge

models:
  claude:
    light: haiku
    standard: sonnet
    heavy: opus
