# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
    # =======================================================
    # GŁÓWNE KOMENDY (DEV CLIENT - ZALECANE DLA OAUTH / NATIVE)
    # =======================================================
    run:
        desc: Run Expo locally using Dev Client (Default) on Android emulator
        dir: frontend/mobile
        interactive: true
        vars:
            ANDROID_SERIAL: '{{default "emulator-5554" .CLI_ARGS}}'
        cmds:
            - bash -lc '(cd ../.. && ./scripts/open-expo-dev-client-android.sh "{{.ANDROID_SERIAL}}") & bun run start'

    run:clear:
        desc: Run Expo locally using Dev Client with cleared cache
        dir: frontend/mobile
        interactive: true
        vars:
            ANDROID_SERIAL: '{{default "emulator-5554" .CLI_ARGS}}'
        cmds:
            - bash -lc '(cd ../.. && ./scripts/open-expo-dev-client-android.sh "{{.ANDROID_SERIAL}}") & bun run start:clear'

    # =======================================================
    # KOMENDY EXPO GO (TYLKO DLA UI / BEZ NATYWNYCH MODUŁÓW)
    # =======================================================
    run:go:
        desc: Run Expo using standard Expo Go on Android emulator
        dir: frontend/mobile
        interactive: true
        vars:
            ANDROID_SERIAL: '{{default "emulator-5554" .CLI_ARGS}}'
        cmds:
            - bash -lc '(cd ../.. && ./scripts/open-expo-android.sh "{{.ANDROID_SERIAL}}") & bun run start:go'

    run:go:clear:
        desc: Run Expo using standard Expo Go with cleared cache
        dir: frontend/mobile
        interactive: true
        vars:
            ANDROID_SERIAL: '{{default "emulator-5554" .CLI_ARGS}}'
        cmds:
            - bash -lc '(cd ../.. && ./scripts/open-expo-android.sh "{{.ANDROID_SERIAL}}") & bun run start:go:clear'

    # =======================================================
    # METRO BUNDLER (BEZ AUTOMATYCZNEGO URUCHAMIANIA NA TELEFONIE)
    # =======================================================
    metro:
        desc: Start Metro bundler only
        dir: frontend/mobile
        interactive: true
        cmds:
            - bun run start

    metro:clear:
        desc: Start Metro bundler only with cleared cache
        dir: frontend/mobile
        interactive: true
        cmds:
            - bun run start:clear

    # =======================================================
    # NARZĘDZIA NATYWNE (BUDOWANIE DEV CLIENTA)
    # =======================================================
    build:android:
        desc: Build and install Expo Development Client on selected Android device
        dir: frontend/mobile
        interactive: true
        vars:
            ANDROID_SERIAL: '{{default "emulator-5554" .CLI_ARGS}}'
        cmds:
            - bash -lc '../../scripts/build-install-expo-dev-client-android.sh "{{.ANDROID_SERIAL}}"'

    prebuild:clean:
        # Uwaga: schemat OAuth Facebooka w intent-filterze pochodzi ze zmiennej
        # środowiskowej. Prebuild bez załadowanego env wygeneruje manifest bez
        # niego i logowanie przez Facebooka przestanie działać po cichu — dlatego
        # ten task ładuje env tak samo jak reszta (dotenv w Taskfile.yml).
        desc: Recreate Android native project from Expo config
        dir: frontend/mobile
        interactive: true
        cmds:
            - bun run prebuild:android

    # =======================================================
    # RĘCZNE OTWIERANIE NA TELEFONIE (JEŚLI BUNDLER JUŻ DZIAŁA)
    # =======================================================
    open:
        desc: Open Dev Client app on Android without starting Metro
        vars:
            ANDROID_SERIAL: '{{default "emulator-5554" .CLI_ARGS}}'
        cmds:
            - bash -lc './scripts/open-expo-dev-client-android.sh "{{.ANDROID_SERIAL}}"'

    open:go:
        desc: Open Expo Go app on Android without starting Metro
        vars:
            ANDROID_SERIAL: '{{default "emulator-5554" .CLI_ARGS}}'
        cmds:
            - bash -lc './scripts/open-expo-android.sh "{{.ANDROID_SERIAL}}"'

    # =======================================================
    # SMOKE BUILDA (TO SAMO CO JOB "Mobile smoke" W CI)
    # =======================================================
    # Bundluje aplikację dla web, android i ios bez emulatora i bez sekretów —
    # łapie błędy Metro/Babel/NativeWind, które przepuściły trzy zielone bramki
    # w #72. Ciężkie: na słabym serwerze (1 CPU) zostaw to CI.
    smoke:
        desc: Bundle the mobile app for web, android and ios (CI smoke test)
        dir: frontend/mobile
        cmds:
            - bun run smoke

    doctor:
        desc: Run expo-doctor (dependency and config health checks)
        dir: frontend/mobile
        cmds:
            - bun run doctor

    # =======================================================
    # EXPO DEVICE HUB (LOKALNE EMULATORY / SYMULATORY W PRZEGLĄDARCE)
    # =======================================================
    # Przy `task mobile:metro` hub jest już dostępny jako plugin dev tools pod
    # http://localhost:8081/_expo/plugins/expo-device-hub — ten task odpala go
    # samodzielnie, bez Metro.
    devices:
        desc: Start Expo Device Hub standalone (needs Android SDK or macOS + Xcode)
        dir: frontend/mobile
        interactive: true
        cmds:
            - bun run devices

    # =======================================================
    # EAS SIMULATOR (CHMURA — WYMAGA DOSTĘPU Z WAITLISTY I `eas login`)
    # =======================================================
    eas:build:simulator:
        desc: Build an installable simulator/emulator app on EAS (task mobile:eas:build:simulator -- ios|android)
        dir: frontend/mobile
        vars:
            PLATFORM: '{{default "ios" .CLI_ARGS}}'
        cmds:
            - bunx eas-cli build --platform {{.PLATFORM}} --profile remote-device --non-interactive

    eas:simulator:
        # Sesja nalicza zużycie, dopóki trwa — limit czasu ucina zapomniane sesje.
        desc: Start an EAS Simulator session (BUILD_ID=<id> task mobile:eas:simulator -- ios|android)
        dir: frontend/mobile
        requires:
            vars: [BUILD_ID]
        vars:
            PLATFORM: '{{default "ios" .CLI_ARGS}}'
        cmds:
            - bunx eas-cli simulator:start --platform {{.PLATFORM}} --type agent-device --build-id {{.BUILD_ID}} --max-duration-minutes 30 --max-idle-time-minutes 10 --non-interactive

    eas:simulator:stop:
        desc: Stop the active EAS Simulator session
        dir: frontend/mobile
        cmds:
            - bunx eas-cli simulator:stop
