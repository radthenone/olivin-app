# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
    AVD_NAME: S23

tasks:
    run:
        desc: Run Android Emulator (task emulator:run -- S23)
        vars:
            AVD_NAME: '{{default .AVD_NAME .CLI_ARGS}}'
        cmds:
            - bash -lc './scripts/run-emulator.sh {{.AVD_NAME}}'
