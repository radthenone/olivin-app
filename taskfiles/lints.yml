# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

# Backend idzie bezpośrednio przez uv. Frontend idzie przez Turborepo, żeby jedna
# komenda obejmowała wszystkie workspace'y (mobile, web, packages/*) i korzystała
# z pamięci podręcznej zadań. Task pozostaje jedynym interfejsem dla człowieka —
# patrz docs/adr/0004-task-jako-interfejs-turborepo-jako-silnik.md
tasks:
    backend:ruff:
        desc: Lint backend with Ruff and apply safe fixes, then format code
        dir: backend
        cmds:
            - uv run ruff check . --fix {{.CLI_ARGS}}
            - uv run ruff format .
    backend:ruff:check:
        desc: Check backend with Ruff without modifying files
        dir: backend
        cmds:
            - uv run ruff check . {{.CLI_ARGS}}
            - uv run ruff format . --check
    backend:typecheck:
        desc: Check Python typing with Pyrefly
        dir: backend
        cmds:
            - uv run pyrefly check

    frontend:lint:
        desc: Lint all frontend workspaces and apply fixes
        dir: frontend
        cmds:
            - bun run lint:fix -- {{.CLI_ARGS}}
    frontend:lint:check:
        desc: Check frontend lint without modifying files
        dir: frontend
        cmds:
            - bun run lint -- {{.CLI_ARGS}}
    frontend:typecheck:
        desc: Type-check all frontend workspaces
        dir: frontend
        cmds:
            - bun run typecheck -- {{.CLI_ARGS}}
    frontend:format:
        desc: Format all frontend workspaces using Prettier
        dir: frontend
        cmds:
            - bun run format -- {{.CLI_ARGS}}
    frontend:format:check:
        desc: Check frontend formatting with Prettier
        dir: frontend
        cmds:
            - bun run format:check -- {{.CLI_ARGS}}
