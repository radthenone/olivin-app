networks:
  olivin-network:
    name: olivin-network
    external: true

volumes:
  olivin-data:
    name: olivin-data
  olivin-media:
    name: olivin-media
  olivin-node_modules:
    name: olivin-node_modules
  olivin-web-node_modules:
    name: olivin-web-node_modules
  olivin-mobile-node_modules:
    name: olivin-mobile-node_modules
  olivin-web-next:
    name: olivin-web-next
  olivin-libretranslate:
    name: olivin-libretranslate

x-backend-build-dev: &backend-build-dev
  context: .
  dockerfile: docker/backend/Dockerfile
  target: dev

x-backend-env: &backend-env
  - ./.envs/dev/backend/django.env
  - ./.envs/dev/backend/db.env
  - ./.envs/dev/backend/cache_broker.env
  - ./.envs/dev/backend/broker.env
  - ./.envs/dev/backend/s3.env
  - ./.envs/dev/backend/email.env
  - ./.envs/dev/backend/authorization.env

x-django: &django
  build: *backend-build-dev
  stdin_open: true
  tty: true
  volumes:
    - ./backend/src:/app/src:z
    - ./backups:/app/backups:z
  depends_on:
    olivin-postgres:
      condition: service_healthy
    olivin-redis:
      condition: service_healthy
    olivin-minio:
      condition: service_healthy
    olivin-libretranslate:
      condition: service_healthy
  networks:
    - olivin-network

x-celery: &celery
  <<: *django
  depends_on:
    olivin-redis:
      condition: service_healthy
    olivin-postgres:
      condition: service_healthy
    olivin-libretranslate:
      condition: service_healthy
  volumes:
    - ./backend/src:/app/src:z
  entrypoint: ["/celery/celery-entrypoint.sh"]

services:
  olivin-postgres:
    container_name: olivin-postgres
    image: postgres:16
    ports:
      - 5434:5432
    volumes:
      - olivin-data:/var/lib/postgresql/data
    env_file:
      - ./.envs/dev/postgres.env
    networks:
      - olivin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olivin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["dev", "backend", "full", "local", "web"]

  olivin-redis:
    container_name: olivin-redis
    image: redis:latest
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - olivin-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["dev", "backend", "full", "local", "test", "web"]

  olivin-minio:
    container_name: olivin-minio
    image: minio/minio:latest
    ports:
      - "${MINIO_SERVER_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - olivin-media:/data
    env_file:
      - ./.envs/dev/minio.env
    networks:
      - olivin-network
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "${MINIO_HEALTHCHECK_URL}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["dev", "backend", "full", "local", "test", "web"]

  olivin-mailhog:
    container_name: olivin-mailhog
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - olivin-network
    profiles: ["dev", "backend", "full", "local", "web"]

  # Silnik tłumaczeń dla środowiska roboczego (ADR 0027). W produkcji tę rolę
  # pełni DeepL, wskazany przez TRANSLATION_PROVIDER.
  #
  # LT_LOAD_ONLY zawęża modele do polskiego i angielskiego — bez tego kontener
  # pobiera komplet języków i pierwszy start ciągnie się kwadransami. Wolumen
  # trzyma pobrane modele, żeby nie powtarzać tego przy każdym `up`.
  olivin-libretranslate:
    container_name: olivin-libretranslate
    image: libretranslate/libretranslate:latest
    environment:
      LT_LOAD_ONLY: "pl,en"
      LT_DISABLE_WEB_UI: "false"
    ports:
      - "${LIBRETRANSLATE_PORT:-5000}:5000"
    volumes:
      - olivin-libretranslate:/home/libretranslate/.local
    networks:
      - olivin-network
    restart: unless-stopped
    healthcheck:
      # Pobranie modeli przy pierwszym starcie trwa, stąd długi start_period —
      # bez niego Docker uznałby usługę za martwą, zanim zdąży wstać.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s
    profiles: ["dev", "backend", "full", "local", "web"]

  olivin-django:
    <<: *django
    container_name: olivin-django
    env_file: *backend-env
    ports:
      - "${DJANGO_PORT}:8000"
    working_dir: /app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "${DJANGO_HEALTHCHECK_URL}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    profiles: ["dev", "backend", "full", "web"]

  olivin-celery-worker:
    <<: *celery
    container_name: olivin-celery-worker
    env_file: *backend-env
    working_dir: /app/src
    command: bash -c "/celery/worker.sh"
    restart: unless-stopped
    profiles: ["dev", "backend", "full", "celery"]

  olivin-celery-beat:
    <<: *celery
    container_name: olivin-celery-beat
    env_file: *backend-env
    working_dir: /app/src
    command: bash -c "/celery/beat.sh"
    restart: unless-stopped
    profiles: ["dev", "backend", "full", "celery"]

  olivin-celery-flower:
    <<: *celery
    container_name: olivin-celery-flower
    env_file: *backend-env
    working_dir: /app/src
    ports:
      - "${FLOWER_PORT}:5555"
    command: bash -c "/celery/flower.sh"
    restart: unless-stopped
    profiles: ["dev", "backend", "full", "celery"]

  # Aplikacja webowa (Next.js) w trybie deweloperskim. Kod z hosta, node_modules
  # w woluminach — patrz docker/frontend/web/Dockerfile. Bundler mobilny zostaje
  # na hoście (ADR 0007), stąd osobny profil "web" bez usług Expo.
  olivin-web:
    container_name: olivin-web
    build:
      context: .
      dockerfile: docker/frontend/web/Dockerfile
      target: dev
    volumes:
      - ./frontend:/app:z
      - olivin-node_modules:/app/node_modules
      - olivin-web-node_modules:/app/web/node_modules
      - olivin-mobile-node_modules:/app/mobile/node_modules
      - olivin-web-next:/app/web/.next
    environment:
      # Przeglądarka woła backend przez port opublikowany na hoście, nie przez
      # sieć kontenerową — stąd 127.0.0.1, nie olivin-django.
      - NEXT_PUBLIC_BACKEND_URL=http://127.0.0.1:${DJANGO_PORT}
      # Zdarzenia inotify nie przechodzą przez wolumin z Windows/macOS, więc
      # w kontenerze Next odpytuje system plików. Turbopack tego trybu tu nie
      # respektuje (watchOptions.pollIntervalMs bez efektu), stąd webpack.
      # Na hoście `task web:run` nadal używa Turbopacka.
      - WATCHPACK_POLLING=true
    command: ["--webpack"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      olivin-django:
        condition: service_started
    networks:
      - olivin-network
    restart: unless-stopped
    profiles: ["web", "full"]
