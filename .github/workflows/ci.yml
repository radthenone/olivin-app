name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

# Nowy push na ten sam PR ubija poprzedni przebieg — bez tego kilka pushów pod rząd
# trzyma runnery zajęte wynikami, których i tak nikt nie przeczyta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI tylko czyta repozytorium. Domyślny token ma szersze uprawnienia, niż potrzeba.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-extras

      # WeasyPrint renderuje PDF dokumentów sprzedaży przez Pango (ADR 0026);
      # test renderu pada bez tych bibliotek systemowych.
      - name: Install PDF rendering libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Ruff
        run: task lints:backend:ruff:check

      - name: Pyrefly
        run: task lints:backend:typecheck

      # Model zmieniony bez migracji przechodzi testy i pada dopiero na deployu.
      - name: Missing migrations
        run: task db:migrations:check

      # Zmieniony serializer bez regeneracji schematu nie psuje żadnego testu —
      # rozjazd wychodzi dopiero, gdy klient frontendu przestaje pasować do API.
      - name: API schema up to date
        run: task backend:schema:check

      - name: Backend tests
        run: task test:backend-local -- src/ -m "not integration"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-bun nie cache'uje pobranych paczek — bez tego każdy przebieg
      # ściąga ponad tysiąc pakietów od zera.
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Sync frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: ESLint
        run: task lints:frontend:lint:check

      - name: TypeScript
        run: task lints:frontend:typecheck

      # Schemat jest pilnowany wzgledem kodu Django osobna kontrola, ale nic nie
      # pilnowalo, czy wygenerowany klient zgadza sie ze schematem. Zmiana
      # serializera bez regeneracji nie psuje zadnego testu — wychodzi dopiero w
      # dzialajacej aplikacji, a po dolozeniu drugiej aplikacji konsumujacej ten
      # sam klient kosztuje dwa razy wiecej.
      - name: API client up to date
        run: task ovral:check

      - name: Prettier check
        run: task lints:frontend:format:check

      # Jedyny test przeglądarkowy: strona główna wstaje i pokazuje stan backendu.
      # Odpowiedź /health/ jest podstawiana w teście, więc Django nie jest tu
      # potrzebne — sprawdzana jest hydratacja i to, co widzi użytkownik.
      - name: Install Playwright browser
        working-directory: frontend/web
        run: bun x playwright install --with-deps chromium

      - name: Web smoke test
        run: task web:e2e

  # Hooki lokalne i CI sprawdzają ten sam kod, ale innymi ścieżkami — i właśnie na tej
  # różnicy CI potrafi paść na czymś, co lokalnie przeszło. Ten job odpala dokładnie te
  # hooki co `git commit`, więc rozjazd wychodzi tutaj, a nie po zmergowaniu.
  # Hooki dotykają obu stron repo, stąd i uv, i Bun w jednym jobie.
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen --all-extras

      - name: Sync frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Hooki formatują w miejscu, więc `--all-files` kończy się błędem, gdy cokolwiek
      # zmieniły — to jest ten sygnał, o który chodzi.
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
