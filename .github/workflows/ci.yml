name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Ruff
        run: task lints:backend:ruff:check

      - name: MyPy
        run: task lints:backend:typecheck

      - name: Backend tests
        run: task test:backend-local -- src/ -m "not integration"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: ESLint
        run: task lints:frontend:lint:check

      - name: TypeScript
        run: task lints:frontend:typecheck

      - name: Prettier check
        run: task lints:frontend:format:check
