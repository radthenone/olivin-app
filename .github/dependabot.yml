version: 2

# PR-y idą na `dev`, nie na default branch (`master`). Praca integruje się na `dev`,
# a `master` dostaje ją przy merge'u `dev` -> `master` — inaczej obie gałęzie
# rozjeżdżają się w zestawie paczek. Patch i minor merguje automatycznie workflow
# `dependabot-automerge.yml` po zielonym CI; majory zostają do ręcznego przejrzenia.
updates:
  # Akcje w workflowach nie mają lockfile'a — wersję trzyma sam plik YAML, więc bez
  # tego nikt nigdy nie podniesie `actions/checkout@v4`. Tu podatność uderza wprost
  # w pipeline, który ma dostęp do repozytorium.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)

  # Natywny ekosystem `uv` podnosi wersję w pyproject.toml i odświeża `uv.lock`
  # w tym samym commicie. CI robi `uv sync --frozen`, więc PR z rozjechanym lockiem
  # nie przejdzie — to warunek, żeby auto-merge był bezpieczny.
  - package-ecosystem: uv
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Aktualizacje łatek osobno na paczkę to szum. Zgrupowane wchodzą jednym PR-em,
      # a wersje minor i major zostają pojedynczo, bo tam trzeba przeczytać changelog.
      python-patch:
        update-types:
          - patch

  # Bun jest wspierany od wersji 1.1.39 — projekt używa nowszej, więc `bun.lock`
  # zostanie zaktualizowany razem z package.json.
  - package-ecosystem: bun
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      js-patch:
        update-types:
          - patch
    ignore:
      # Wersje Expo, Reacta i React Native są związane z konkretnym SDK Expo —
      # podnoszenie ich pojedynczo rozjeżdża projekt. Te idą razem z upgradem SDK,
      # ręcznie, według przewodnika migracji.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-*
